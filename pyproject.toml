[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yujia-network-science-toolkit"
version = "0.1.0"
description = "A reusable toolkit for network science"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24"
]

[tool.setuptools.packages.find]
where = ["src"]